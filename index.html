<html lang="es">

    <title>Control de Gastos</title>
    <meta name="apple-mobile-web-app-capable" content="yes">

        .btn-inc { background: var(--ganancia); }
        .btn-cons { background: var(--consultorio); }
        .btn-exp { background: var(--gasto); }
