<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Gastos</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
        button { border: none; font-weight: bold; color: white; cursor: pointer; }
        .btn-inc { background: #10b981; }
        .btn-exp { background: #ef4444; }
        .debt-box { border: 2px solid #ddd; padding: 10px; margin: 5px; border-radius: 8px; display: inline-block; width: 40%; text-align: center; }
        .paid { background: #dcfce7; border-color: #10b981; text-decoration: line-through; }
        .item { background: #eee; padding: 10px; border-radius: 8px; margin-top: 5px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <div class="card">
        <label>MES:</label>
        <select id="month" onchange="saveMonth()"><option>Enero</option><option>Febrero</option><option>Marzo</option></select>
    </div>

    <div class="card">
        <h3>Nueva Anotación</h3>
        <input type="text" id="desc" placeholder="¿En qué?">
        <input type="number" id="amt" placeholder="Monto $">
        <button onclick="add('income')" class="btn-inc">+ Ganancia</button>
        <button onclick="add('expense')" class="btn-exp">- Gasto</button>
    </div>

    <div class="card">
        <h3>Plan Deuda Negro</h3>
        <div id="plan"></div>
    </div>

    <div class="card">
        <h3>Historial</h3>
        <div id="list"></div>
        <button onclick="download()" style="background:#3b82f6; margin-top:20px">📥 Descargar Resumen</button>
    </div>

<script>
    // Base de datos simple
    let data = JSON.parse(localStorage.getItem('datos_gastos')) || { trans: [], paid: [], month: 'Enero' };

    const PLAN_CUOTAS = [
        {id:'p1', m:'Dic 24', a:'100k'}, {id:'p2', m:'Ene 25', a:'160k'},
        {id:'p3', m:'Feb 25', a:'200k'}, {id:'p4', m:'Mar 25', a:'200k'}
    ];

    function add(type) {
        const d = document.getElementById('desc').value;
        const a = document.getElementById('amt').value;
        if(!d || !a) return alert("Completa los campos");
        
        data.trans.push({ d, a, type });
        update();
        document.getElementById('desc').value = '';
        document.getElementById('amt').value = '';
    }

    function toggle(id) {
        if(data.paid.includes(id)) {
            data.paid = data.paid.filter(i => i !== id);
        } else {
            data.paid.push(id);
        }
        update();
    }

    function saveMonth() {
        data.month = document.getElementById('month').value;
        update();
    }

    function download() {
        let txt = "RESUMEN " + data.month + "\n\n";
        data.trans.forEach(t => txt += t.type + ": " + t.d + " $" + t.a + "\n");
        const blob = new Blob([txt], {type: 'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'gastos.txt';
        a.click();
    }

    function update() {
        localStorage.setItem('datos_gastos', JSON.stringify(data));
        render();
    }

    function render() {
        document.getElementById('month').value = data.month;
        const list = document.getElementById('list');
        list.innerHTML = '';
        data.trans.forEach(t => {
            list.innerHTML += `<div class="item"><span>${t.d}</span><span>$${t.a}</span></div>`;
        });

        const plan = document.getElementById('plan');
        plan.innerHTML = '';
        PLAN_CUOTAS.forEach(p => {
            const isPaid = data.paid.includes(p.id);
            plan.innerHTML += `<div class="debt-box ${isPaid ? 'paid' : ''}" onclick="toggle('${p.id}')">${p.m}<br>$${p.a}</div>`;
        });
    }

    render();
</script>
</body>
</html>
