<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Ganancias y Gastos</title>
    <style>
        :root { --ganancia: #10b981; --gasto: #ef4444; --porqueria: #a855f7; --deuda: #f59e0b; --balance: #3b82f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; margin: 0; padding: 10px; color: #1e293b; }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { text-align: center; font-size: 22px; margin: 20px 0; color: #0f172a; }

        /* Tarjetas de Resumen */
        .resumen-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .card-sm { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .label { font-size: 11px; font-weight: bold; color: #64748b; text-transform: uppercase; margin-bottom: 5px; }
        .val { font-size: 18px; font-weight: 800; }

        /* Secciones Principales */
        .section { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h3 { margin-top: 0; font-size: 18px; display: flex; align-items: center; gap: 8px; }
        
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 12px; border: 1px solid #e2e8f0; font-size: 16px; box-sizing: border-box; }
        .btn-main { border: none; font-weight: bold; color: white; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .btn-inc { background: var(--ganancia); }
        .btn-exp { background: var(--gasto); }
        .btn-del { background: #fee2e2; color: #ef4444; font-size: 12px; width: auto; padding: 5px 10px; border: none; }

        /* Listas e Historial */
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #f8fafc; border-radius: 12px; margin-bottom: 8px; border-left: 4px solid #cbd5e1; }
        .item-info { display: flex; flex-direction: column; }
        .item-name { font-weight: bold; font-size: 14px; }
        .item-sub { font-size: 11px; color: #64748b; }
        .total-box { background: #dbeafe; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; font-weight: bold; color: #1e40af; }

        /* Plan Deuda */
        .debt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .box { border: 2px solid #f1f5f9; padding: 10px; border-radius: 12px; text-align: center; cursor: pointer; background: white; font-size: 13px; }
        .paid { background: #dcfce7; border-color: var(--ganancia); color: #065f46; text-decoration: line-through; }
    </style>
</head>
<body>

<div class="container">
    <h1>Contador de Ganancias y Gastos</h1>

    <div class="resumen-grid">
        <div class="card-sm"><div class="label">Ganancias</div><div id="t-gan" class="val" style="color:var(--ganancia)">$0</div></div>
        <div class="card-sm"><div class="label">Gastos</div><div id="t-gas" class="val" style="color:var(--gasto)">$0</div></div>
        <div class="card-sm"><div class="label">Porquería</div><div id="t-por" class="val" style="color:var(--porqueria)">$0</div></div>
        <div class="card-sm"><div class="label">Deudas Mes Pasado</div><div id="t-deu" class="val" style="color:var(--deuda)">$0</div></div>
        <div class="card-sm" style="grid-column: span 2; text-align: center;">
            <div class="label">Balance Actual</div><div id="t-bal" class="val" style="color:var(--balance)">$0</div>
        </div>
    </div>

    <div class="section">
        <label class="label">Mes de Registro</label>
        <select id="sel-mes" onchange="render()"><option>Enero</option><option>Febrero</option><option>Marzo</option></select>
        
        <h3>📝 Agregar Transacción</h3>
        <input type="text" id="t-desc" placeholder="Descripción">
        <input type="number" id="t-monto" placeholder="Monto $" inputmode="decimal">
        <select id="t-cat">
            <option value="General">General</option>
            <option value="Porquería">Porquería</option>
            <option value="Deuda">Deuda Mes Pasado</option>
        </select>
        <div style="display:flex; gap:10px">
            <button onclick="addTrans('gan')" class="btn-main btn-inc">+ Ganancia</button>
            <button onclick="addTrans('gas')" class="btn-main btn-exp">- Gasto</button>
        </div>
    </div>

    <div class="section">
        <h3>👥 Me deben dinero</h3>
        <input type="text" id="d-nom" placeholder="Nombre">
        <input type="number" id="d-mon" placeholder="Monto $" inputmode="decimal">
        <button onclick="addDeudor()" class="btn-main" style="background:var(--balance)">+ Agregar Deudor</button>
        <div id="lista-deudores" style="margin: 15px 0;"></div>
        <div class="total-box"><span>💰 Total a Cobrar</span><span id="t-cobrar">$0</span></div>
    </div>

    <div class="section">
        <h3>💳 Plan Deuda Negro</h3>
        <div id="plan-negro" class="debt-grid"></div>
    </div>

    <div class="section">
        <h3>📊 Historial de Transacciones</h3>
        <div id="historial"></div>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('canva_final_db')) || { trans: [], deudores: [], plan: [], mes: 'Enero' };

    const CUOTAS = [
        {id:'1', m:'Dic 24', a:'100k'}, {id:'2', m:'Ene 25', a:'160k'},
        {id:'3', m:'Feb 25', a:'200k'}, {id:'4', m:'Mar 25', a:'200k'}
    ];

    function addTrans(tipo) {
        const desc = document.getElementById('t-desc').value;
        const monto = parseFloat(document.getElementById('t-monto').value);
        const cat = document.getElementById('t-cat').value;
        const mes = document.getElementById('sel-mes').value;
        if(!desc || !monto) return;
        db.trans.push({ id: Date.now(), desc, monto, tipo, cat, mes, fecha: new Date().toLocaleDateString() });
        save();
        document.getElementById('t-desc').value = ''; document.getElementById('t-monto').value = '';
    }

    function addDeudor() {
        const nombre = document.getElementById('d-nom').value;
        const monto = parseFloat(document.getElementById('d-mon').value);
        if(!nombre || !monto) return;
        db.deudores.push({ id: Date.now(), nombre, monto });
        save();
        document.getElementById('d-nom').value = ''; document.getElementById('d-mon').value = '';
    }

    function delTrans(id) { db.trans = db.trans.filter(t => t.id !== id); save(); }
    function delDeudor(id) { db.deudores = db.deudores.filter(d => d.id !== id); save(); }
    function togPlan(id) { db.plan.includes(id) ? db.plan = db.plan.filter(p => p !== id) : db.plan.push(id); save(); }

    function save() {
        localStorage.setItem('canva_final_db', JSON.stringify(db));
        render();
    }

    function render() {
        const mes = document.getElementById('sel-mes').value;
        let g = 0, s = 0, p = 0, d = 0;
        
        // Historial y Sumas
        const hDiv = document.getElementById('historial'); hDiv.innerHTML = '';
        db.trans.filter(t => t.mes === mes).forEach(t => {
            if(t.tipo === 'gan') g += t.monto;
            else {
                s += t.monto;
                if(t.cat === 'Porquería') p += t.monto;
                if(t.cat === 'Deuda') d += t.monto;
            }
            const color = t.tipo === 'gan' ? 'var(--ganancia)' : 'var(--gasto)';
            hDiv.innerHTML += `
                <div class="item-row" style="border-left-color:${color}">
                    <div class="item-info"><span class="item-name">${t.desc}</span><span class="item-sub">${t.cat} • ${t.fecha}</span></div>
                    <div style="display:flex; align-items:center; gap:10px">
                        <span style="font-weight:800; color:${color}">${t.tipo==='gan'?'+':'-'}$${t.monto.toLocaleString()}</span>
                        <button class="btn-del" onclick="delTrans(${t.id})">Eliminar</button>
                    </div>
                </div>`;
        });

        // Deudores
        const dDiv = document.getElementById('lista-deudores'); dDiv.innerHTML = '';
        let cob = 0;
        db.deudores.forEach(deu => {
            cob += deu.monto;
            dDiv.innerHTML += `
                <div class="item-row" style="border-left-color:var(--balance)">
                    <span class="item-name">${deu.nombre}</span>
                    <div style="display:flex; align-items:center; gap:10px">
                        <span style="font-weight:bold; color:var(--balance)">$${deu.monto.toLocaleString()}</span>
                        <button class="btn-del" onclick="delDeudor(${deu.id})">Eliminar</button>
                    </div>
                </div>`;
        });

        // Totales finales
        document.getElementById('t-gan').innerText = `$${g.toLocaleString()}`;
        document.getElementById('t-gas').innerText = `$${s.toLocaleString()}`;
        document.getElementById('t-por').innerText = `$${p.toLocaleString()}`;
        document.getElementById('t-deu').innerText = `$${d.toLocaleString()}`;
        document.getElementById('t-bal').innerText = `$${(g - s).toLocaleString()}`;
        document.getElementById('t-cobrar').innerText = `$${cob.toLocaleString()}`;

        // Plan Negro
        const pDiv = document.getElementById('plan-negro'); pDiv.innerHTML = '';
        CUOTAS.forEach(c => {
            const isP = db.plan.includes(c.id);
            pDiv.innerHTML += `<div class="box ${isP?'paid':''}" onclick="togPlan('${c.id}')"><strong>${c.m}</strong><br>$${c.a}</div>`;
        });
    }
    render();
</script>
</body>
</html>
